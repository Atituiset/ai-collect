  <rect x="520" y="1040" width="225" height="75" rx="8" fill="#f2e2f4" stroke="#1c2b24" stroke-width="1.5"/>
  <text x="633" y="1072" text-anchor="middle" font-size="21" fill="#1c2b24">Output</text>

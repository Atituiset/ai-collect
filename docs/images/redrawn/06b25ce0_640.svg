  <text x="12" y="696" font-size="24" font-weight="bold" fill="#1c2b24">Encoder</text>
  <text x="12" y="728" font-size="24" font-weight="bold" fill="#1c2b24">layer</text>

  <!-- encoder blocks -->
  <rect x="180" y="495" width="210" height="44" rx="6" fill="#fbf1cd" stroke="#1c2b24" stroke-width="1.4"/>
  <text x="285" y="524" text-anchor="middle" font-size="20" fill="#1c2b24">Add &amp; Norm</text>
  <rect x="180" y="555" width="210" height="44" rx="6" fill="#f8e7c6" stroke="#1c2b24" stroke-width="1.4"/>
  <text x="285" y="584" text-anchor="middle" font-size="20" fill="#1c2b24">Feed Forward</text>
  <rect x="180" y="705" width="210" height="44" rx="6" fill="#fbf1cd" stroke="#1c2b24" stroke-width="1.4"/>
  <text x="285" y="734" text-anchor="middle" font-size="20" fill="#1c2b24">Add &amp; Norm</text>

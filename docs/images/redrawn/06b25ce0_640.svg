  <line x1="628" y1="743" x2="628" y2="738" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="628" y1="690" x2="628" y2="608" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="628" y1="528" x2="628" y2="523" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="628" y1="475" x2="628" y2="433" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="628" y1="385" x2="628" y2="373" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="628" y1="325" x2="628" y2="284" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>


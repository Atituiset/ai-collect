  <text x="628" y="414" text-anchor="middle" font-size="20" fill="#1c2b24">Feed Forward</text>
  <rect x="520" y="475" width="215" height="44" rx="6" fill="#fbf1cd" stroke="#1c2b24" stroke-width="1.4"/>
  <text x="628" y="504" text-anchor="middle" font-size="20" fill="#1c2b24">Add &amp; Norm</text>
  <rect x="520" y="528" width="215" height="76" rx="6" fill="#f2e2f4" stroke="#1c2b24" stroke-width="1.4"/>
  <text x="628" y="558" text-anchor="middle" font-size="20" fill="#1c2b24">Multi-Head</text>
  <text x="628" y="586" text-anchor="middle" font-size="20" fill="#1c2b24">Attention</text>
  <rect x="520" y="690" width="215" height="44" rx="6" fill="#fbf1cd" stroke="#1c2b24" stroke-width="1.4"/>
  <text x="628" y="719" text-anchor="middle" font-size="20" fill="#1c2b24">Add &amp; Norm</text>

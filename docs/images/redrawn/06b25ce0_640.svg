  <rect x="170" y="1040" width="225" height="75" rx="8" fill="#f2e2f4" stroke="#1c2b24" stroke-width="1.5"/>
  <text x="283" y="1072" text-anchor="middle" font-size="21" fill="#1c2b24">Input</text>
  <text x="283" y="1100" text-anchor="middle" font-size="21" fill="#1c2b24">Embedding</text>
  <line x1="285" y1="1040" x2="285" y2="984" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="285" y1="1160" x2="285" y2="1119" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>

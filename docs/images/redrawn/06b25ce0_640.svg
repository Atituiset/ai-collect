  <text x="285" y="820" text-anchor="middle" font-size="20" fill="#1c2b24">Attention</text>

  <!-- encoder vertical flow -->
  <line x1="285" y1="920" x2="285" y2="847" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="285" y1="758" x2="285" y2="753" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="285" y1="705" x2="285" y2="603" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="285" y1="555" x2="285" y2="543" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- encoder self-attention side inputs -->
  <line x1="230" y1="872" x2="230" y2="847" stroke="#1c2b24" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="872" x2="340" y2="847" stroke="#1c2b24" stroke-width="2" marker-end="url(#arr)"/>

  <!-- encoder residuals -->
  <path d="M345,843 C425,843 425,727 393,727" fill="none" stroke="#1c2b24" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M345,599 C425,599 425,517 393,517" fill="none" stroke="#1c2b24" stroke-width="2" marker-end="url(#arr)"/>

  <!-- cross connection encoder -> decoder MHA -->

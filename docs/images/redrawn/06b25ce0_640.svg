  <line x1="628" y1="188" x2="628" y2="112" stroke="#1c2b24" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="520" y="140" width="215" height="48" rx="6" fill="#e4ddf3" stroke="#1c2b24" stroke-width="1.5"/>

  <line x1="572" y1="640" x2="572" y2="608" stroke="#2e7d5b" stroke-width="2" marker-end="url(#arrA)"/>
  <line x1="688" y1="640" x2="688" y2="608" stroke="#2e7d5b" stroke-width="2" marker-end="url(#arrA)"/>
  <path d="M630,524 L630,646" fill="none" stroke="#2e7d5b" stroke-width="2.5"/>


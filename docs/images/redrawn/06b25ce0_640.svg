  <path d="M690,604 C772,604 772,497 739,497" fill="none" stroke="#1c2b24" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M690,429 C772,429 772,347 739,347" fill="none" stroke="#1c2b24" stroke-width="2" marker-end="url(#arr)"/>

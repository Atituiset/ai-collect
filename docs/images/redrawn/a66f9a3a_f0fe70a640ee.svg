<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 961" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect width="1080" height="961" fill="#faf9f6"/>
  <rect x="30" y="115" width="810" height="770" rx="10" fill="none" stroke="#2e7d5b" stroke-width="3"/>

  <!-- concentric圈层 circles -->
  <circle cx="330" cy="470" r="285" fill="none" stroke="#9fb3aa" stroke-width="1.2"/>
  <circle cx="330" cy="470" r="215" fill="none" stroke="#9fb3aa" stroke-width="1.2"/>
  <text x="105" y="290" fill="#1c2b24" font-size="20" text-anchor="middle">第二圈层</text>

  <!-- pyramid -->
  <path d="M388,295 L610,840 L166,840 Z" fill="none" stroke="#1c2b24" stroke-width="2.5"/>
  <g stroke="#1c2b24" stroke-width="1.8">
    <line x1="332" y1="430" x2="444" y2="430"/>
    <line x1="300" y1="510" x2="476" y2="510"/>
    <line x1="262" y1="600" x2="514" y2="600"/>
    <line x1="224" y1="690" x2="552" y2="690"/>
    <line x1="192" y1="770" x2="584" y2="770"/>
  </g>
  <g fill="#1c2b24" text-anchor="middle">
    <text x="316" y="322" font-size="20">第一圈层</text>
    <text x="388" y="392" font-size="22">CXO</text>
    <text x="310" y="428" font-size="16">合伙人</text>
    <text x="388" y="478" font-size="18">高管</text>
    <text x="388" y="564" font-size="18">总监 + 关键人</text>
    <text x="388" y="654" font-size="18">经理 + 核心员工</text>
    <text x="388" y="742" font-size="18">熟悉员工</text>
    <text x="388" y="806" font-size="16">小白</text>
  </g>

  <!-- role boxes right of pyramid -->
  <g fill="#ffffff" stroke="#1c2b24" stroke-width="1.5">
    <rect x="500" y="470" width="58" height="260" rx="10"/>
    <rect x="572" y="440" width="58" height="230" rx="10"/>
    <rect x="644" y="330" width="58" height="220" rx="10"/>
    <rect x="716" y="295" width="58" height="235" rx="10"/>
  </g>
  <g fill="#1c2b24" font-size="17" text-anchor="middle">
    <text x="529" y="520">项</text><text x="529" y="548">目</text><text x="529" y="576">执</text><text x="529" y="604">行</text>
    <text x="601" y="478">导</text><text x="601" y="506">师</text><text x="601" y="534">+</text><text x="601" y="562">面</text><text x="601" y="590">试</text><text x="601" y="618">官</text>
    <text x="673" y="400">干</text><text x="673" y="428">训</text><text x="673" y="456">班</text>
    <text x="745" y="330">核</text><text x="745" y="358">心</text><text x="745" y="386">项</text><text x="745" y="414">目</text><text x="745" y="442">负</text><text x="745" y="470">责</text><text x="745" y="498">人</text>
  </g>

  <!-- 培训+一般任务 -->
  <rect x="515" y="775" width="230" height="46" rx="10" fill="#ffffff" stroke="#1c2b24" stroke-width="1.5"/>
  <text x="630" y="804" fill="#1c2b24" font-size="17" text-anchor="middle">培训 + 一般任务</text>
  <line x1="610" y1="730" x2="610" y2="770" stroke="#1c2b24" stroke-width="1.2"/>

  <!-- right chart -->
  <g stroke="#1c2b24" stroke-width="1.5">
    <line x1="855" y1="855" x2="855" y2="360"/>
    <line x1="855" y1="855" x2="1065" y2="855"/>
  </g>
  <text x="855" y="345" fill="#1c2b24" font-size="14" text-anchor="end">影响力/能力</text>
  <g fill="#1c2b24" font-size="17" text-anchor="end">
    <text x="848" y="435">90</text>
    <text x="848" y="545">67.5</text>
    <text x="848" y="655">45</text>
    <text x="848" y="760">22.5</text>
    <text x="848" y="860">0</text>
  </g>
  <g stroke="#9fb3aa" stroke-width="1">
    <line x1="855" y1="430" x2="1065" y2="430"/>
    <line x1="855" y1="540" x2="1065" y2="540"/>
    <line x1="855" y1="650" x2="1065" y2="650"/>
    <line x1="855" y1="755" x2="1065" y2="755"/>
  </g>
  <path d="M855,850 C950,845 1010,830 1060,770" fill="none" stroke="#2e7d5b" stroke-width="2.5"/>
  <path d="M1000,840 C1025,815 1045,790 1060,768" fill="none" stroke="#2e7d5b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- annotation boxes -->
  <rect x="865" y="712" width="160" height="66" fill="#ffffff" stroke="#1c2b24" stroke-width="1"/>
  <text x="872" y="732" fill="#1c2b24" font-size="12">做了一个难度适中的项</text>
  <text x="872" y="749" fill="#1c2b24" font-size="12">目，能力值和在团队中的</text>
  <text x="872" y="766" fill="#1c2b24" font-size="12">口碑得到提升</text>
  <rect x="1003" y="565" width="60" height="72" fill="#ffffff" stroke="#1c2b24" stroke-width="1"/>
  <text x="1008" y="582" fill="#1c2b24" font-size="11">做了一个很</text>
  <text x="1008" y="598" fill="#1c2b24" font-size="11">难的项目…</text>
  <text x="1008" y="614" fill="#1c2b24" font-size="11">“指点”下完</text>
  <text x="1008" y="630" fill="#1c2b24" font-size="11">成，颇大</text>

  <!-- top cut-off circle fragment -->
  <circle cx="700" cy="-10" r="120" fill="none" stroke="#9fb3aa" stroke-width="1.2"/>
  <rect x="680" y="0" width="60" height="20" rx="4" fill="#ffffff" stroke="#1c2b24" stroke-width="1"/>
  <text x="710" y="15" fill="#1c2b24" font-size="12" text-anchor="middle">市书店</text>
  <text x="748" y="215" fill="#1c2b24" font-size="18">南</text>
  <text x="1020" y="890" fill="#1c2b24" font-size="18" text-anchor="middle">事件1</text>
</svg>

    <rect x="920" y="477" width="116" height="55" rx="8" fill="#e4e8de" stroke="#9aa39b" stroke-width="1.3"/>
    <rect x="912" y="486" width="116" height="55" rx="8" fill="#f2f3ec" stroke="#1c2b24" stroke-width="1.6"/>
    <text x="970" y="520" text-anchor="middle" font-size="20" fill="#1c2b24">Linear</text>
  </g>

  <!-- arrows Linear -> SDPA -->
  <line x1="710" y1="486" x2="710" y2="418" stroke="#1c2b24" stroke-width="2.2" marker-end="url(#arr3)"/>
  <line x1="840" y1="486" x2="840" y2="418" stroke="#1c2b24" stroke-width="2.2" marker-end="url(#arr3)"/>
  <line x1="970" y1="486" x2="970" y2="418" stroke="#1c2b24" stroke-width="2.2" marker-end="url(#arr3)"/>


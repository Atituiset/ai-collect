  <line x1="840" y1="620" x2="840" y2="545" stroke="#1c2b24" stroke-width="2.4" marker-end="url(#arr3)"/>
  <line x1="970" y1="620" x2="970" y2="545" stroke="#1c2b24" stroke-width="2.4" marker-end="url(#arr3)"/>
  <text x="710" y="655" text-anchor="middle" font-size="24" font-weight="bold" font-style="italic" fill="#1c2b24">V</text>
  <text x="840" y="655" text-anchor="middle" font-size="24" font-weight="bold" font-style="italic" fill="#1c2b24">K</text>
  <text x="970" y="655" text-anchor="middle" font-size="24" font-weight="bold" font-style="italic" fill="#1c2b24">Q</text>

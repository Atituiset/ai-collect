<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 810" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect width="1080" height="810" fill="#faf9f6"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d5b"/>
    </marker>
  </defs>

  <text x="540" y="55" fill="#1c2b24" font-size="44" font-weight="bold" text-anchor="middle">求职系统总览图</text>
  <text x="540" y="98" fill="#1c2b24" font-size="19" text-anchor="middle">— 从简历到面试，再到高杠杆求职路径 —</text>

  <!-- panel frames -->
  <g fill="#ffffff" stroke="#1c2b24" stroke-width="1.2">
    <rect x="12" y="120" width="252" height="570" rx="10"/>
    <rect x="278" y="120" width="252" height="570" rx="10"/>
    <rect x="544" y="120" width="252" height="570" rx="10"/>
    <rect x="810" y="120" width="258" height="570" rx="10"/>
  </g>
  <g font-size="16" font-weight="bold">
    <rect x="22" y="132" width="24" height="24" rx="4" fill="#2e7d5b"/><text x="34" y="150" fill="#ffffff" text-anchor="middle">1</text>
    <text x="54" y="150" fill="#1c2b24">简历信息可信度分层</text>
    <rect x="288" y="132" width="24" height="24" rx="4" fill="#2e7d5b"/><text x="300" y="150" fill="#ffffff" text-anchor="middle">2</text>
    <text x="320" y="150" fill="#1c2b24">好简历五大原则</text>
    <rect x="554" y="132" width="24" height="24" rx="4" fill="#2e7d5b"/><text x="566" y="150" fill="#ffffff" text-anchor="middle">3</text>
    <text x="586" y="150" fill="#1c2b24">简历如何引导面试</text>
    <rect x="820" y="132" width="24" height="24" rx="4" fill="#2e7d5b"/><text x="832" y="150" fill="#ffffff" text-anchor="middle">4</text>
    <text x="852" y="150" fill="#1c2b24">求职渠道杠杆模型</text>
  </g>
  <g stroke="#2e7d5b" stroke-width="2" marker-end="url(#arr)">
    <line x1="266" y1="144" x2="276" y2="144"/>
    <line x1="532" y1="144" x2="542" y2="144"/>
    <line x1="798" y1="144" x2="808" y2="144"/>
  </g>

  <!-- ===== panel 1: pyramid ===== -->
  <g stroke="#1c2b24" stroke-width="1.2">
    <path d="M70,180 L108,290 L32,290 Z" fill="#dcefe6"/>
    <path d="M32,290 L108,290 L122,380 L18,380 Z" fill="#b7ddd0"/>
    <path d="M18,380 L122,380 L132,470 L8,470 Z" fill="#8ec9b4"/>
    <path d="M8,470 L132,470 L140,555 L0,555 Z" fill="#6db198"/>
  </g>
  <g fill="#1c2b24" font-size="11">
    <text x="138" y="196" font-weight="bold">第一层</text>
    <text x="138" y="212">（高可信，造假成本高）</text>
    <text x="138" y="232">· 学历信息</text>
    <text x="138" y="248">· 公司信息</text>
    <text x="138" y="264">· 薪酬信息</text>
    <text x="138" y="280">· 专业证书</text>
    <text x="138" y="306" font-weight="bold">第二层</text>
    <text x="138" y="322">（较易辨明）</text>
    <text x="138" y="342">· 职位信息</text>
    <text x="138" y="358">· 汇报关系</text>
    <text x="138" y="374">· 团队规模</text>
    <text x="138" y="406" font-weight="bold">第三层</text>
    <text x="138" y="422">（面试重点核验）</text>
    <text x="138" y="442">· 项目信息</text>
    <text x="138" y="458">· 项目角色</text>
    <text x="138" y="474">· 业务结果</text>
    <text x="138" y="490">· 关键贡献</text>
    <text x="138" y="522" font-weight="bold">第四层</text>
    <text x="138" y="538">（价值最低）</text>
    <text x="138" y="558">· 自我评价</text>
    <text x="138" y="574">· 空泛形容词</text>
    <text x="138" y="590">· 堆砌名词</text>
  </g>
  <rect x="22" y="600" width="232" height="70" rx="8" fill="#f2f7f4" stroke="#2e7d5b" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="138" y="628" fill="#1c2b24" font-size="12.5" font-weight="bold" text-anchor="middle">💡 企业真正重视的是：</text>
  <text x="138" y="652" fill="#1c2b24" font-size="12.5" text-anchor="middle">项目与能力能否被讲清楚</text>

  <!-- ===== panel 2: five principles ===== -->
  <circle cx="404" cy="420" r="62" fill="#2e7d5b"/>
  <text x="404" y="408" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">简历 =</text>
  <text x="404" y="430" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">面试脚本，</text>
  <text x="404" y="450" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">不是个人传记</text>
  <g stroke="#9fb3aa" stroke-width="1" stroke-dasharray="4 3">
    <line x1="404" y1="358" x2="404" y2="300"/>
    <line x1="462" y1="386" x2="500" y2="340"/>
    <line x1="462" y1="454" x2="495" y2="500"/>
    <line x1="346" y1="454" x2="313" y2="500"/>
    <line x1="346" y1="386" x2="308" y2="340"/>
  </g>
  <g fill="#ffffff" stroke="#1c2b24" stroke-width="1.2">
    <circle cx="404" cy="255" r="48"/>
    <circle cx="503" cy="330" r="48"/>
    <circle cx="487" cy="520" r="48"/>
    <circle cx="321" cy="520" r="48"/>
    <circle cx="305" cy="330" r="48"/>
  </g>
  <g fill="#2e7d5b">
    <circle cx="404" cy="205" r="10"/><circle cx="503" cy="280" r="10"/><circle cx="487" cy="470" r="10"/><circle cx="321" cy="470" r="10"/><circle cx="305" cy="280" r="10"/>
  </g>
  <g fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="404" y="209">1</text><text x="503" y="284">2</text><text x="487" y="474">3</text><text x="321" y="474">4</text><text x="305" y="284">5</text>
  </g>
  <g fill="#1c2b24" font-size="10.5" text-anchor="middle">
    <text x="404" y="238" font-weight="bold">目标清晰：</text>
    <text x="404" y="254">先定岗位、公司、</text>
    <text x="404" y="270">职级，再决定</text>
    <text x="404" y="286">写什么</text>
    <text x="503" y="316" font-weight="bold">简洁：</text>
    <text x="503" y="332">一页优先，</text>
    <text x="503" y="348">删除无关信息</text>
    <text x="487" y="506" font-weight="bold">优势突出：</text>
    <text x="487" y="522">围绕目标岗位</text>
    <text x="487" y="538">放大卖点</text>
    <text x="321" y="506" font-weight="bold">基本真实：</text>
    <text x="321" y="522">可包装，但要能</text>
    <text x="321" y="538">经得住追问</text>
    <text x="305" y="316" font-weight="bold">引导面试：</text>
    <text x="305" y="332">埋钩子，把节奏</text>
    <text x="305" y="348">带到自己熟悉区</text>
  </g>

  <!-- ===== panel 3: guide flow ===== -->
  <g fill="#ffffff" stroke="#1c2b24" stroke-width="1.2">
    <rect x="560" y="175" width="220" height="40" rx="8"/>
    <rect x="560" y="245" width="220" height="40" rx="8"/>
    <rect x="560" y="315" width="220" height="40" rx="8"/>
    <rect x="560" y="385" width="220" height="40" rx="8"/>
  </g>
  <g fill="#1c2b24" font-size="14" text-anchor="middle">
    <text x="670" y="200">📍 定位目标岗位</text>
    <text x="670" y="270">💎 选择核心卖点</text>
    <text x="670" y="340">🪝 写入简历钩子</text>
    <text x="670" y="410">👤 面试官顺势追问</text>
  </g>
  <g stroke="#2e7d5b" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="670" y1="215" x2="670" y2="241"/>
    <line x1="670" y1="285" x2="670" y2="311"/>
    <line x1="670" y1="355" x2="670" y2="381"/>
    <line x1="670" y1="425" x2="670" y2="447"/>
    <line x1="670" y1="535" x2="670" y2="561"/>
  </g>
  <rect x="560" y="450" width="220" height="85" rx="8" fill="#f2f7f4" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="575" y="474" fill="#1c2b24" font-size="13" font-weight="bold">💬 用 SCR 框架回答</text>
  <text x="575" y="496" fill="#1c2b24" font-size="12">S：Situation 情景</text>
  <text x="575" y="514" fill="#1c2b24" font-size="12">C：Complication 冲突/问题</text>
  <text x="575" y="532" fill="#1c2b24" font-size="12">R：Resolution 解决/结果</text>
  <rect x="560" y="564" width="220" height="40" rx="8" fill="#ffffff" stroke="#1c2b24" stroke-width="1.2"/>
  <text x="670" y="589" fill="#1c2b24" font-size="14" text-anchor="middle">🎯 回到岗位匹配</text>
  <rect x="560" y="620" width="220" height="55" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="1"/>
  <text x="670" y="643" fill="#b58900" font-size="12" text-anchor="middle">★ 面试时重点讲的，</text>
  <text x="670" y="662" fill="#b58900" font-size="12" text-anchor="middle">必须在简历中提前布局</text>

  <!-- ===== panel 4: leverage model ===== -->
  <rect x="818" y="172" width="115" height="34" rx="6" fill="#9fb3aa"/>
  <text x="875" y="194" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">低杠杆：冷投简历</text>
  <rect x="945" y="172" width="115" height="34" rx="6" fill="#2e7d5b"/>
  <text x="1002" y="194" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">高杠杆：关系背书</text>

  <g fill="#ffffff" stroke="#1c2b24" stroke-width="1">
    <rect x="818" y="225" width="115" height="50" rx="6"/>
    <rect x="818" y="300" width="115" height="50" rx="6"/>
    <rect x="818" y="375" width="115" height="50" rx="6"/>
    <rect x="818" y="450" width="115" height="60" rx="6"/>
  </g>
  <g fill="#1c2b24" font-size="12" text-anchor="middle">
    <text x="875" y="255">✈ 海投岗位</text>
    <text x="875" y="330">👤 HR初筛</text>
    <text x="875" y="405">👥 技术/业务面</text>
    <text x="875" y="478">📉 通过率低</text>
    <text x="875" y="498">议价弱</text>
  </g>
  <g fill="#ffffff" stroke="#2e7d5b" stroke-width="1.2">
    <rect x="945" y="225" width="115" height="62" rx="6"/>
    <rect x="945" y="312" width="115" height="50" rx="6"/>
    <rect x="945" y="387" width="115" height="50" rx="6"/>
    <rect x="945" y="462" width="115" height="76" rx="6"/>
  </g>
  <g fill="#1c2b24" font-size="11.5" text-anchor="middle">
    <text x="1002" y="246">平时经营能力</text>
    <text x="1002" y="264">外化（作品/</text>
    <text x="1002" y="282">案例/口碑）</text>
    <text x="1002" y="342">👥 结识行业大佬</text>
    <text x="1002" y="417">👍 推荐/背书</text>
    <text x="1002" y="490">📈 初筛更稳</text>
    <text x="1002" y="508">面试更顺</text>
    <text x="1002" y="526">议价更强</text>
  </g>
  <g stroke="#1c2b24" stroke-width="1.2" marker-end="url(#arr)">
    <line x1="875" y1="275" x2="875" y2="296"/>
    <line x1="875" y1="350" x2="875" y2="371"/>
    <line x1="875" y1="425" x2="875" y2="446"/>
  </g>
  <g stroke="#2e7d5b" stroke-width="1.2" marker-end="url(#arr)">
    <line x1="1002" y1="287" x2="1002" y2="308"/>
    <line x1="1002" y1="362" x2="1002" y2="383"/>
    <line x1="1002" y1="437" x2="1002" y2="458"/>
  </g>
  <circle cx="939" cy="420" r="17" fill="#1c2b24"/>
  <text x="939" y="426" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">VS</text>

  <!-- footer -->
  <rect x="12" y="710" width="1056" height="80" rx="10" fill="#ffffff" stroke="#1c2b24" stroke-width="1.2"/>
  <text x="60" y="760" fill="#1c2b24" font-size="26" font-weight="bold">🏆 结论：</text>
  <text x="240" y="760" fill="#1c2b24" font-size="20">真正的求职不是只投简历，而是经营自己的<tspan fill="#b58900" font-weight="bold">职业信用与外部杠杆</tspan></text>
</svg>

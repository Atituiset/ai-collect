  <text x="953" y="275" text-anchor="middle" font-size="9.5" fill="#1c2b24">Multi-Head</text>
  <text x="953" y="289" text-anchor="middle" font-size="9.5" fill="#1c2b24">Attention</text>
  <rect x="907" y="322" width="92" height="20" rx="4" fill="#fbf1cd" stroke="#1c2b24" stroke-width="0.9"/>
  <text x="953" y="336" text-anchor="middle" font-size="9.5" fill="#1c2b24">Add &amp; Norm</text>
  <rect x="907" y="348" width="92" height="56" rx="4" fill="#f2e2f4" stroke="#1c2b24" stroke-width="0.9"/>

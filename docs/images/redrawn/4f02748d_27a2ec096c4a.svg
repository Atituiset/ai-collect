<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 525" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect width="1008" height="525" fill="#faf9f6"/>

  <text x="504" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1c2b24">GPU 显存 = 一张桌子</text>

  <!-- left panel: 4K tokens -->
  <rect x="30" y="85" width="425" height="218" rx="12" fill="#f4f3ec" stroke="#2e7d5b" stroke-width="2"/>
  <circle cx="185" cy="122" r="10" fill="#2e7d5b"/>
  <text x="205" y="131" font-size="20" font-weight="bold" fill="#2e7d5b">4K tokens</text>

  <rect x="60" y="150" width="155" height="125" rx="8" fill="#4a7fbc"/>
  <text x="137" y="218" text-anchor="middle" font-size="18" fill="#ffffff">模型参数</text>
  <rect x="232" y="150" width="100" height="125" rx="8" fill="#2e7d5b"/>
  <text x="282" y="208" text-anchor="middle" font-size="17" fill="#ffffff">KV</text>
  <text x="282" y="232" text-anchor="middle" font-size="17" fill="#ffffff">Cache</text>
  <rect x="348" y="150" width="80" height="125" rx="8" fill="#e3e1d8" stroke="#9a988c" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="388" y="218" text-anchor="middle" font-size="16" fill="#8a887c">空闲</text>

  <circle cx="200" cy="334" r="11" fill="#2e7d5b"/>
  <path d="M194,334 L199,340 L207,329" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <text x="222" y="341" font-size="20" font-weight="bold" fill="#2e7d5b">轻松放下</text>

  <!-- right panel: 128K tokens -->
  <rect x="535" y="85" width="445" height="218" rx="12" fill="#f4f3ec" stroke="#c0392b" stroke-width="2"/>
  <circle cx="672" cy="122" r="10" fill="#c0392b"/>
  <text x="692" y="131" font-size="20" font-weight="bold" fill="#c0392b">128K tokens</text>

  <rect x="560" y="150" width="108" height="125" rx="8" fill="#4a7fbc"/>
  <text x="614" y="208" text-anchor="middle" font-size="16" fill="#ffffff">模型</text>
  <text x="614" y="230" text-anchor="middle" font-size="16" fill="#ffffff">参数</text>
  <rect x="685" y="150" width="235" height="125" rx="8" fill="#c0392b"/>
  <text x="802" y="208" text-anchor="middle" font-size="19" fill="#ffffff">巨大的</text>
  <text x="802" y="236" text-anchor="middle" font-size="19" fill="#ffffff">KV Cache</text>
  <rect x="925" y="135" width="18" height="155" rx="5" fill="#e0705f" stroke="#c0392b" stroke-width="1.5"/>
  <text x="960" y="220" font-size="22" fill="#c0392b">💥</text>

  <circle cx="672" cy="334" r="11" fill="#c0392b"/>
  <path d="M667,329 L677,339 M677,329 L667,339" stroke="#ffffff" stroke-width="2.5"/>
  <text x="694" y="341" font-size="20" font-weight="bold" fill="#c0392b">显存溢出 (OOM)</text>

  <!-- bottom summary bar -->
  <rect x="30" y="385" width="948" height="95" rx="12" fill="#f4f3ec" stroke="#cfcdc2" stroke-width="1.5"/>
  <text x="504" y="420" text-anchor="middle" font-size="19" font-weight="bold" fill="#1c2b24">以 LLaMA-2 70B 为例（FP16）</text>
  <rect x="150" y="440" width="14" height="14" rx="3" fill="#4a7fbc"/>
  <text x="174" y="453" font-size="18" fill="#3a6ea8">模型本身 ≈ 140 GB</text>
  <rect x="600" y="440" width="14" height="14" rx="3" fill="#c0392b"/>
  <text x="624" y="453" font-size="18" fill="#c0392b">128K KV Cache ≈ 160+ GB</text>
</svg>

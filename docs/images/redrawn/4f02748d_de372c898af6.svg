<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 393" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect width="990" height="393" fill="#faf9f6"/>

  <text x="495" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1c2b24">模型输出质量 vs 上下文长度</text>

  <!-- axes -->
  <line x1="115" y1="70" x2="115" y2="320" stroke="#1c2b24" stroke-width="2"/>
  <line x1="115" y1="320" x2="955" y2="320" stroke="#1c2b24" stroke-width="2"/>
  <text x="30" y="195" text-anchor="middle" font-size="17" fill="#1c2b24" transform="rotate(-90 30 195)">输出质量 →</text>
  <text x="495" y="372" text-anchor="middle" font-size="17" fill="#1c2b24">上下文长度 →</text>

  <!-- quality curve -->
  <path d="M140,130 C300,124 480,128 580,140 C700,156 820,230 925,295" fill="none" stroke="#5a6ee0" stroke-width="4"/>

  <!-- training limit dashed line -->
  <line x1="580" y1="75" x2="580" y2="320" stroke="#c9a227" stroke-width="2.5" stroke-dasharray="10,7"/>
  <text x="580" y="348" text-anchor="middle" font-size="16" font-weight="bold" fill="#a8851b">训练长度上限</text>

  <!-- data points -->
  <circle cx="220" cy="128" r="7" fill="#5a6ee0"/>
  <circle cx="420" cy="133" r="7" fill="#5a6ee0"/>
  <circle cx="580" cy="140" r="8" fill="#c9a227"/>
  <circle cx="740" cy="225" r="7" fill="#d94f3d"/>
  <circle cx="925" cy="295" r="7" fill="#d94f3d"/>

  <!-- annotations -->
  <circle cx="262" cy="105" r="10" fill="#2e7d5b"/>
  <path d="M257,105 L261,109 L268,100" stroke="#ffffff" stroke-width="2.2" fill="none"/>
  <text x="280" y="112" font-size="18" font-weight="bold" fill="#2e7d5b">训练见过的长度</text>
  <text x="182" y="180" font-size="17" fill="#1c2b24">稳定 🎯</text>

  <text x="700" y="108" font-size="18" font-weight="bold" fill="#d94f3d">⚠ 超出训练范围</text>
  <text x="700" y="282" font-size="17" fill="#1c2b24">开始胡说 🤯</text>
</svg>

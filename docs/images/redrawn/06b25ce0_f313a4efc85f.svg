  <!-- ===== right: formulation ===== -->
  <text x="720" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d5b">Formulation for Positional Encoding</text>
  <text x="440" y="78" font-size="18" font-style="italic" fill="#1c2b24">PE<tspan dy="4" font-size="12">(pos,2i)</tspan><tspan dy="-4"> = sin(pos / 10000</tspan><tspan dy="-7" font-size="12">2i/d</tspan><tspan dy="3" font-size="9">model</tspan><tspan dy="4">)</tspan></text>
  <text x="440" y="110" font-size="18" font-style="italic" fill="#1c2b24">PE<tspan dy="4" font-size="12">(pos,2i+1)</tspan><tspan dy="-4"> = cos(pos / 10000</tspan><tspan dy="-7" font-size="12">2i/d</tspan><tspan dy="3" font-size="9">model</tspan><tspan dy="4">)</tspan></text>


<text x="350" y="38" font-size="14" fill="#1c2b24">MCP (Model Context Protocol, 2025b;c), A2A (A2A Project, 2025), Function Calling (OpenAI, 2026c), OpenAPI</text>
<text x="350" y="58" font-size="14" fill="#1c2b24">(OpenAPI Initiative, 2025), AGENTS.md (agentsmd, 2025), Interop. Survey (Ehtesham et al., 2025)</text>

<text x="350" y="198" font-size="14" fill="#1c2b24">et al., 2023), CREATOR (Qian et al., 2023b), Agentic Code Reasoning (Ugare &amp; Chandra, 2026), LangChain</text>
<text x="350" y="218" font-size="14" fill="#1c2b24">(LangChain, 2026c), Semantic Kernel (Microsoft, 2026), smolagents (Hugging Face, 2026)</text>

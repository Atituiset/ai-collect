<text x="350" y="287" font-size="14" fill="#1c2b24">BFCL (Patil et al., 2025), StableToolBench (Guo et al., 2024), API-Bank (Li et al., 2023b), TaskBench (Shen et al.,</text>
<text x="350" y="307" font-size="14" fill="#1c2b24">2024)</text>
